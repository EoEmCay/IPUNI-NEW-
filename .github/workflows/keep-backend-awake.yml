name: Keep backend awake

# Render free tier tự "ngủ" backend sau ~15 phút không có request, lần request kế tiếp
# mất 20-30+ giây để khởi động lại (đo thực tế: 22.8s khi ngủ, 0.39s khi đã "ấm"). Ping
# /health định kỳ mỗi 10 phút để backend không bao giờ đủ rảnh 15 phút để ngủ.
#
# Đây là giải pháp đi đường vòng cho giới hạn của gói free, không phải giải pháp chính
# thống - nếu nâng cấp lên gói Render trả phí (không tự ngủ) thì có thể xoá workflow này.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} - %{time_total}s\n" \
            --max-time 60 \
            https://dia-5hzu.onrender.com/health
